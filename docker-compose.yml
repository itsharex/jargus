services:
  jargus:
    build:
      context: .
      dockerfile: Dockerfile
    image: jargus:2.0.0
    container_name: jargus
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # 是否开启登录鉴权（默认开启）
      APP_AUTH_ENABLED: "true"
      # JWT 密钥留空 = 每次启动随机生成（容器重建后需重新登录，推荐）；
      # 需跨重建保留登录态才在 .env 配置固定值
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      # AES 密钥（库内敏感字段静态加密）：生产环境请在 .env 配置
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:-a1b2c3d4e5f6g7h8}
      # JVM 参数
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
    volumes:
      - jargus-data:/app/data
      - jargus-work:/app/work
      - jargus-logs:/app/logs
      - jargus-lib:/app/lib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  jargus-data:
  jargus-work:
  jargus-logs:
  jargus-lib:
